<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C&C 2022</title>
  <link rel="icon" href="assets/cc.png" type="image/png" sizes="512x512">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="styles/index.css">
  <link rel="stylesheet" href="styles/highlight.css">
</head>
<body>
  <input type="checkbox" id="menu-toggle" hidden>
  <header>
    <div class="main-header">
      <div class="left-header">
        <a href="index.html">
          <img class="logo" src="assets/cc-name.png" alt="c&c-logo">
        </a>
        <a class="homepage-link" href="index.html">
          <p class="event-name">ChiPrian</p>
        </a>
      </div>
      <div class="middle-header">
        <a class="photos" href="photos.html">Photos</a>
        <a class="videos" href="videos.html">Videos</a>
      </div>
      <div class="right-header">
        <div class="right-header-menu">
          <a class="highlight" href="highlight.html">Highlight</a>
          <a class="about" href="about.html">About</a>
          <a class="contact" href="contact.html">Contact</a>
        </div>
        <div class="darkMode">
          <label class="dark-mode-toggle">
            <input type="checkbox" id="dark-toggle">
            🌙
          </label>
          <div class="tool-tip js-theme-tooltip"></div>
        </div>
        <div class="menu-icon-div">
          <label class="menu-icon" for="menu-toggle">☰
          </label>
          <div class="tool-tip js-menu-tooltip">Open Menu</div>
        </div>
    </div>
  </div>
  </header>

  <main>
    <div class="main-body">
      <div class="content-body">
        <h1>
          Chidinma &#38; Cyprian's Video Highlight
        </h1>
        <h3>22nd October, 2022</h3>
      </div>

      <div class="video-board">
        <div class="flex-div">
          <div class="main-video">
            <video width="600" controls>
              <source src="assets/videos/Highlights.mp4" type="video/mp4">
              Your browser does not support the video tag.
            </video>
          </div>
          <div class="video-details">
            <div class="details-div">
              <p class="details">Highlight of the Wedding and Reception.</p>
              <div class="clock-icon">
                <i class="fa-solid fa-clock"></i>
              </div>
              <div class="time-div">
                <p class="time">1 min 49 secs</p>
              </div> <br>
              <div class="location-camera">
                <div class="location-icon">
                  <i class="fa-solid fa-location-dot"></i>
                  <p class="location-name">Christ Embassy Abakaliki 1</p>  
                </div>
                <div class="camera-icon">
                  <i class="fa-solid fa-video"></i>
                  <p class="camera-name">Nicetouch Studios</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
<!--
      <footer>
        &copy ChiPrian 2022
      </footer>
-->
    </div>
  </main>

  <script src="index.js"></script>
</body>
</html>
